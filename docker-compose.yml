version: '3.8'

services:
  backend:
    build: ./backend-nestjs
    container_name: maccan-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./backend-nestjs/data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET:-maccan-prod-change-me}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/auth/me"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: maccan-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
